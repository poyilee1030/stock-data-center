[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-data-center"
version = "0.1.0"
description = "PIT-safe Taiwan stock data center"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  # Step 24: the TDCC archive stores 2021 onward as .7z (audit §4.9).
  "py7zr>=1.0,<2",
  "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL 18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_data_center"]
