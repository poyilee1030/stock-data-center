services:
  postgres:
    image: postgres:18
    # Sized for this 31 GB desktop and a 13 GB database; measured before and
    # after with scripts/bench_postgres.py. /dev/shm backs parallel query's
    # shared memory, and Docker's default of 64 MB is too small for it.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      # The data sits on an NVMe SSD and mostly in RAM: with the default 4, a
      # larger work_mem made the planner prefer a full sort to an index scan.
      - -c
      - random_page_cost=1.1
    shm_size: 1g
    environment:
      POSTGRES_DB: stockdc
      POSTGRES_USER: stockdc
      POSTGRES_PASSWORD: stockdc
    # This machine only (owner, 2026-09-25): clients reach the data through the
    # API, never the database. An uncommon port, below Linux's ephemeral range.
    ports:
      - "127.0.0.1:26519:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdc -d stockdc"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - stockdc-postgres-data:/var/lib/postgresql

  # The public API (docs/api.md): every interface of this office desktop, so
  # clients on the LAN or the tailnet can call it (owner, 2026-09-25). The key
  # comes from .env; the API refuses to start without one.
  api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://stockdc:stockdc@postgres:5432/${STOCKDC_API_DATABASE:-stockdc_backfill}
      STOCKDC_API_KEY: ${STOCKDC_API_KEY:-}
    ports:
      - "0.0.0.0:28617:28617"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stockdc-postgres-data:
